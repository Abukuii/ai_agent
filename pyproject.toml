[project]
name = "ai-marketing-agent"
version = "0.1.0"
description = "Open-source AI Marketing Agent for Telegram"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
